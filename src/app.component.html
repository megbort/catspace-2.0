@if (authService.isInitialized()) {
  <a class="skip-link" href="#main" (click)="focusMain($event)">
    {{ "a11y.skipToContent" | translate }}
  </a>
  <mat-sidenav-container class="min-h-screen flex flex-col">
    <mat-sidenav
      #profileDrawer
      mode="over"
      position="end"
      [disableClose]="true"
      (openedChange)="onSidenavToggle($event)"
    >
      <app-user-sidenav
        (sidenavClose)="profileDrawer.close()"
      ></app-user-sidenav>
    </mat-sidenav>

    <mat-sidenav-content class="flex flex-col grow">
      <app-menu (open)="profileDrawer.open()"></app-menu>
      <main id="main" #main tabindex="-1" class="outline-none min-h-screen">
        <router-outlet></router-outlet>
      </main>
      <app-footer></app-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
}

<app-loader></app-loader>
