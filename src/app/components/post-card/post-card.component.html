<div
  class="flex flex-col gap-2 justify-between shadow-card rounded p-3 h-[270px] w-[250px] bg-card"
>
  <button
    type="button"
    class="post-image group relative block cursor-pointer w-full h-[170px] overflow-hidden rounded p-0 border-none bg-transparent"
    [attr.aria-label]="'a11y.viewPost' | translate: { title: post().title }"
    (click)="open.emit()"
  >
    @defer (on viewport) {
      <img
        unpic
        [src]="post().image"
        alt=""
        class="w-full h-full object-cover rounded block"
      />
    } @placeholder {
      <span class="block bg-catspace-grey w-full h-full rounded"></span>
    }
    <span
      class="absolute top-0 left-0 w-full h-full bg-catspace-brown/50 flex justify-center items-center opacity-0 group-hover:opacity-100 group-focus-visible:opacity-100 transition-opacity duration-300 rounded"
      aria-hidden="true"
    >
      <span class="text-body-1 text-catspace-white">
        {{ "post.view" | translate }}
      </span>
    </span>
  </button>
  <div class="flex flex-col gap-1">
    <div>
      <p class="subtitle-2 line-clamp-2">{{ post().title }}</p>
    </div>
    <div class="flex justify-between items-center">
      <p class="text-body-2 line-clamp-1">
        {{ favoriteCount() }} {{ "common.favorites" | translate }}
      </p>
      <div class="relative inline-block">
        <button
          type="button"
          class="heart-button hover:cursor-pointer bg-transparent border-none p-0 text-catspace-orange hover:text-catspace-dark-orange"
          [disabled]="loading()"
          (click)="toggleFavorite($event)"
          [attr.aria-label]="
            (isFavorited() ? 'a11y.removeFavorite' : 'a11y.addFavorite')
              | translate
          "
        >
          @if (isFavorited()) {
            <span class="material-icons icon-18" aria-hidden="true">favorite</span>
          } @else {
            <span class="material-icons icon-18" aria-hidden="true">favorite_border</span>
          }
        </button>
        @if (showSparkles()) {
          <div class="sparkles-container">
            @for (sparkle of [1, 2, 3, 4, 5]; track sparkle) {
              <span aria-hidden="true" class="sparkle sparkle-{{ sparkle }}">✨</span>
            }
          </div>
        }
      </div>
    </div>
  </div>
</div>
